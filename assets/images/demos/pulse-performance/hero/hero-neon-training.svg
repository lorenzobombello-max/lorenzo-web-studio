<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="AI generated neon training hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="55%" stop-color="#0a1633"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#79ff3c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="110" r="210" fill="#00f2ff" opacity="0.12"/>
  <circle cx="280" cy="760" r="240" fill="#ff2da5" opacity="0.12"/>
  <g opacity="0.85" filter="url(#glow)">
    <path d="M180 680 L440 420 L760 520 L980 320 L1400 420" stroke="url(#line)" stroke-width="8" fill="none"/>
    <path d="M220 740 L500 500 L820 600 L1040 400 L1460 500" stroke="#ff2da5" stroke-width="4" fill="none" opacity="0.7"/>
  </g>
  <g fill="none" stroke="#9bc8ff" opacity="0.26">
    <rect x="120" y="120" width="1360" height="660" rx="26"/>
    <rect x="160" y="160" width="1280" height="580" rx="22"/>
  </g>
  <text x="170" y="785" fill="#d8ebff" font-size="88" font-family="Outfit,Segoe UI,sans-serif" font-weight="700">PULSE PERFORMANCE</text>
  <text x="176" y="840" fill="#9bc8ff" font-size="28" font-family="Outfit,Segoe UI,sans-serif" letter-spacing="4">AI GENERATED HERO CONCEPT</text>
</svg>
