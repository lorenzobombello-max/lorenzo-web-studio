name: Deploy Commercial Operator Command

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/commercial-operator-command/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/github-app-gate6-probe/runtime.ts"
      # Release-gate call graph: the continuity-predeploy/continuity-postdeploy
      # steps below execute exactly these files. Any one of them can change
      # whether a production release is allowed, so this workflow must
      # re-trigger on current main whenever any of them change - otherwise a
      # historical Edge run can silently keep using an outdated gate
      # implementation. Keep this list explicit and bounded to the actual
      # call graph; do NOT replace it with a broad scripts wildcard glob.
      - ".github/workflows/deploy-commercial-operator-command.yml"
      - "scripts/invoke-dossier-continuity-ci-gate.ps1"
      - "scripts/invoke-dossier-continuity-release-gate.ps1"
      - "scripts/dossier-continuity-regression-gate.mjs"
      - "scripts/dossier-continuity-regression-gate.test.mjs"
      - "scripts/dossier-continuity-release-integration.test.mjs"
      - "scripts/operator-dossiers-pricing-refresh.test.mjs"
      - "scripts/operator-pricing-vat-edge-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-operator-command-production
  cancel-in-progress: false

jobs:
  continuity-predeploy:
    runs-on: ubuntu-latest
    environment: production-continuity

    steps:
      - name: Require current production branch
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw "HARD STOP - controlled Edge releases must run from refs/heads/main"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Require dossier continuity before deploy
        shell: pwsh
        env:
          LWS_RELEASE_SMOKE_EMAIL: ${{ secrets.LWS_RELEASE_SMOKE_EMAIL }}
          LWS_RELEASE_SMOKE_PASSWORD: ${{ secrets.LWS_RELEASE_SMOKE_PASSWORD }}
          LWS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LWS_SUPABASE_PUBLISHABLE_KEY }}
        run: ./scripts/invoke-dossier-continuity-ci-gate.ps1 -Phase PreDeploy

      - name: Preserve predeploy dossier counts
        uses: actions/upload-artifact@v4
        with:
          name: dossier-continuity-before
          path: .gate/dossiers-before.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: continuity-predeploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install locked release tooling
        run: npm ci

      - name: Require Edge deployment credentials
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LWS_SUPABASE_PROJECT_REF: ${{ vars.LWS_SUPABASE_PROJECT_REF }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) { throw "HARD STOP - SUPABASE_ACCESS_TOKEN is required" }
          if ([string]::IsNullOrWhiteSpace($env:LWS_SUPABASE_PROJECT_REF)) { throw "HARD STOP - LWS_SUPABASE_PROJECT_REF is required" }

      - name: Deploy commercial operator command only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LWS_SUPABASE_PROJECT_REF: ${{ vars.LWS_SUPABASE_PROJECT_REF }}
        run: npx --no-install supabase functions deploy commercial-operator-command --project-ref "$LWS_SUPABASE_PROJECT_REF"

  continuity-postdeploy:
    runs-on: ubuntu-latest
    needs: deploy
    environment: production-continuity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore predeploy dossier counts
        uses: actions/download-artifact@v4
        with:
          name: dossier-continuity-before
          path: .gate

      - name: Require dossier continuity after deploy
        shell: pwsh
        env:
          LWS_RELEASE_SMOKE_EMAIL: ${{ secrets.LWS_RELEASE_SMOKE_EMAIL }}
          LWS_RELEASE_SMOKE_PASSWORD: ${{ secrets.LWS_RELEASE_SMOKE_PASSWORD }}
          LWS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LWS_SUPABASE_PUBLISHABLE_KEY }}
        run: ./scripts/invoke-dossier-continuity-ci-gate.ps1 -Phase PostDeploy

      - name: Preserve postdeploy dossier counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-continuity-after
          path: .gate/dossiers-after.json
          if-no-files-found: error
          retention-days: 1

  release-approved:
    runs-on: ubuntu-latest
    needs: continuity-postdeploy

    steps:
      - name: Approve production release
        run: echo "PRODUCTION_RELEASE_ALLOWED=JA"
