name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  continuity-predeploy:
    runs-on: ubuntu-latest
    environment: production-continuity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require dossier continuity before deploy
        shell: pwsh
        env:
          LWS_RELEASE_SMOKE_EMAIL: ${{ secrets.LWS_RELEASE_SMOKE_EMAIL }}
          LWS_RELEASE_SMOKE_PASSWORD: ${{ secrets.LWS_RELEASE_SMOKE_PASSWORD }}
          LWS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LWS_SUPABASE_PUBLISHABLE_KEY }}
        run: ./scripts/invoke-dossier-continuity-ci-gate.ps1 -Phase PreDeploy

      - name: Preserve predeploy dossier counts
        uses: actions/upload-artifact@v4
        with:
          name: dossier-continuity-before
          path: .gate/dossiers-before.json
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: continuity-predeploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build allowlisted Pages artifact
        shell: pwsh
        env:
          LWS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LWS_SUPABASE_PUBLISHABLE_KEY }}
        run: ./scripts/prepare-pages-dist.ps1 -OutputDir dist

      - name: Verify dist security and link integrity
        shell: pwsh
        run: ./scripts/verify-pages-dist.ps1 -DistDir dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  continuity-postdeploy:
    runs-on: ubuntu-latest
    needs: deploy
    environment: production-continuity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore predeploy dossier counts
        uses: actions/download-artifact@v4
        with:
          name: dossier-continuity-before
          path: .gate

      - name: Require dossier continuity after deploy
        shell: pwsh
        env:
          LWS_RELEASE_SMOKE_EMAIL: ${{ secrets.LWS_RELEASE_SMOKE_EMAIL }}
          LWS_RELEASE_SMOKE_PASSWORD: ${{ secrets.LWS_RELEASE_SMOKE_PASSWORD }}
          LWS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LWS_SUPABASE_PUBLISHABLE_KEY }}
        run: ./scripts/invoke-dossier-continuity-ci-gate.ps1 -Phase PostDeploy

      - name: Preserve postdeploy dossier counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-continuity-after
          path: .gate/dossiers-after.json
          if-no-files-found: error
          retention-days: 1

  release-approved:
    runs-on: ubuntu-latest
    needs: continuity-postdeploy

    steps:
      - name: Approve production release
        run: echo "PRODUCTION_RELEASE_ALLOWED=JA"
